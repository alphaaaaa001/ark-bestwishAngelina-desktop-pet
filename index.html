<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>CC 桌面身体</title>
  <style>
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      width: 100%; height: 100%;
      user-select: none;
      cursor: grab;
    }
    #stage { position: absolute; inset: 0; overflow: hidden; }
    video {
      position: absolute;
      left: 0; top: 0;
      /* 尺寸和位置由 JS 按人物 bbox 计算：object-fit:fill 把画布填进 video 元素，
         再定位让 bbox 区域对齐到身体区（顶部留气泡楼层），stage 的 overflow:hidden 裁掉其余部分 */
      width: 1000px; height: 1000px;
      object-fit: fill;
      pointer-events: none;
      filter: drop-shadow(0 0 18px rgba(120, 200, 255, 0.25));
    }
    #bubble {
      position: absolute;
      top: 4px; left: 50%;
      transform: translateX(-50%);
      background: rgba(12, 18, 32, 0.72);
      color: #cfefff;
      padding: 6px 14px;
      border-radius: 999px;
      font: 12px "Microsoft YaHei";
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      border: 1px solid rgba(127, 208, 255, 0.25);
    }
    #bubble.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="v" muted playsinline autoplay></video>
    <div id="bubble"></div>
    <audio id="music" preload="auto"></audio>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
